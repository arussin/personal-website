name: Publish website to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_live_version:
        description: Current production Worker version UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: adamrussin-website-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'arussin/personal-website' && github.ref == 'refs/heads/main'
    environment: website-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Check generated pages
        run: |
          python tools/build-vista.py
          python tools/check-search.py
          git diff --exit-code
      - name: Package committed bytes
        run: node tools/package-worker.mjs "$RUNNER_TEMP/website-release"
      - name: Install pinned Wrangler outside source
        run: npm install --prefix "$RUNNER_TEMP/website-cli" --ignore-scripts --no-audit --no-fund wrangler@4.144.0
      - name: Publish exact version and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEBSITE_API_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.expected_live_version || 'auto' }}
        run: node tools/publish-worker.mjs "$RUNNER_TEMP/website-release" "$RUNNER_TEMP/website-cli/node_modules/wrangler/bin/wrangler.js" "$EXPECTED_VERSION" "$GITHUB_SHA" --execute
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/website-release/manifest.json
            ${{ runner.temp }}/website-release/publication-receipt.json
          retention-days: 30
          if-no-files-found: warn
